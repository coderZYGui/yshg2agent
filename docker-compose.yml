services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliance
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://compliance:compliance@postgres:5432/compliance
      VECTOR_BACKEND: pgvector
      # 填入真实 Key 即切换到 MiniMax; 留空则 Mock 模式
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.minimaxi.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-MiniMax-M1}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  miniodata:
