services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      LLM_PROVIDER: dashscope_app
      DATABASE_URL: sqlite:////app/data/app.db
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - ./backend/data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
