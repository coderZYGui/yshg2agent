services:
  backend:
    build: ./backend
    environment:
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.minimaxi.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-MiniMax-M1}"
      LLM_PROVIDER: "${LLM_PROVIDER:-minimax}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      DASHSCOPE_APP_ID: "${DASHSCOPE_APP_ID:-}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}"
      DASHSCOPE_FILE_UPLOAD_URL: "${DASHSCOPE_FILE_UPLOAD_URL:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
